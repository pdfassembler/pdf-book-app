<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const WORKER_URL = 'https://gemini-proxy.uvstorynet.workers.dev'; 

let chapters = [];
let _busy = false;
let _syncedPageIdx = 0;
let _ocrPages = [];
let _transPagesSync = [];
let _tesseractWorker = null;

// ==========================================
// HELPERS & GARBAGE FILTER
// ==========================================
function stripInvisible(s){ return s ? String(s).replace(/[\u200B-\u200F\u202A-\u202E\uFEFF\u00AD]/g,'') : ''; }
function updateProgress(p, pc){
  let b = document.getElementById(p+'ProgressBar');
  let t = document.getElementById(p+'ProgressText');
  if(b) b.style.width = Math.min(100, Math.max(0, pc)) + '%';
  if(t) t.textContent = Math.round(pc) + '%';
}

function cleanOCRText(t){
  if(!t) return '';
  let lines = String(t).split('\n'), out = [], cur = '';
  for(let ln of lines){
    let x = ln.trim();
    if(!x){ if(cur){ out.push(cur); cur = ''; } continue; }
    if(cur && (cur.endsWith('.')||cur.endsWith('?')||cur.endsWith('!')||cur.endsWith('۔'))){ out.push(cur); cur = x; }
    else cur = cur ? cur + ' ' + x : x;
  }
  if(cur) out.push(cur);
  
  // Garbage Filter: Remove lines repeating more than 3 times
  let linesArray = out.join('\n\n').split('\n\n');
  let uniqueLines = [];
  let seen = {};
  for (let line of linesArray) {
      let cleanLine = line.trim();
      if (!cleanLine || cleanLine.split(/\s+/).length < 3) continue;
      if (seen[cleanLine]) seen[cleanLine]++;
      else { seen[cleanLine] = 1; uniqueLines.push(cleanLine); }
  }
  let finalClean = uniqueLines.filter(line => seen[line] <= 3);
  return finalClean.join('\n\n');
}

// ==========================================
// STRICT LANGUAGE SANITIZER
// ==========================================
function sanitizeOutput(text, targetLang) {
    if (!text) return "";
    
    // STRICT ENGLISH CHECK
    if (targetLang === 'en') {
        // Agar AI ne ghalti se Urdu ya Hindi likh di hai, to error throw karo taake dobara try ho
        let urduChars = (text.match(/[\u0600-\u06FF]/g) || []).length;
        let hindiChars = (text.match(/[\u0900-\u097F]/g) || []).length;
        
        if ((urduChars > 10 || hindiChars > 10) && (urduChars + hindiChars) > text.length * 0.1) {
            throw new Error("AI ne Urdu/Hindi mein likha hai. Dobara English mein translate kiya ja raha hai...");
        }
        // Remove any leftover Urdu/Hindi
        return text.replace(/[\u0600-\u06FF\u0900-\u097F]+/g, '');
    }
    
    // STRICT URDU CHECK
    if (targetLang === 'ur') {
        text = text.replace(/[\u0900-\u097F]+/g, '');
        
        let urduChars = (text.match(/[\u0600-\u06FF]/g) || []).length;
        let engChars = (text.match(/[A-Za-z]/g) || []).length;
        
        if (engChars > urduChars * 1.5 && engChars > 20) {
            throw new Error("AI ne Roman Urdu mein likha hai. Dobara Urdu mein translate kiya ja raha hai...");
        }
        
        let lines = text.split('\n');
        let cleanLines = [];
        for (let line of lines) {
            let words = line.trim().split(/\s+/);
            let engWords = words.filter(w => /^[A-Za-z]+$/.test(w)).length;
            if (words.length > 0 && engWords / words.length > 0.8 && words.length < 10) continue; 
            cleanLines.push(line);
        }
        return cleanLines.join('\n');
    }
    
    return text;
}

// ==========================================
// FILE INPUT & UI RENDER
// ==========================================
document.getElementById('pdfInput').addEventListener('change', async e => {
  let files = Array.from(e.target.files);
  for(let f of files){
    let buf = await f.arrayBuffer();
    let pdf = await pdfjsLib.getDocument({data: buf}).promise;
    chapters.push({
      file: f,
      title: f.name.replace(/\.pdf$/i, ''),
      pages: pdf.numPages,
      text: '',
      pagesText: [],
      ocrDone: false,
      translatedPages: null
    });
  }
  renderChapters();
});

function renderChapters(){
  let list = document.getElementById('fileList');
  if(!chapters.length){ list.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No files added yet.</p>'; return; }
  list.innerHTML = '';
  chapters.forEach((ch, i) => {
    let div = document.createElement('div');
    div.className = 'chapterRow ' + (ch.ocrDone ? 'done' : '');
    div.innerHTML = `
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 overflow-hidden">
          <div class="chapNum">${i+1}</div>
          <div class="truncate">
            <b class="text-sm text-slate-800 truncate block">${ch.title}</b>
            <p class="text-[10px] text-slate-500">${ch.pages} pages | ${ch.ocrDone ? '✅ OCR Done' : '⏳ Pending'}</p>
          </div>
        </div>
        <div class="flex gap-1 shrink-0">
          <button onclick="runFullOCR(${i})" class="bg-amber-100 hover:bg-amber-200 text-amber-700 px-2 py-1 rounded text-xs font-bold transition whitespace-nowrap" title="Extract Text from this PDF">⚡ OCR</button>
          <button onclick="removeChapter(${i})" class="bg-red-50 hover:bg-red-100 text-red-600 px-2 py-1 rounded text-xs font-bold transition">✕</button>
        </div>
      </div>`;
    list.appendChild(div);
  });
}
function removeChapter(idx){
  chapters.splice(idx, 1);
  renderChapters();
  rebuildSyncedPages();
}

// ==========================================
// OCR ENGINE
// ==========================================
async function getTesseractWorker(){
  if(_tesseractWorker) return _tesseractWorker;
  let lang = document.getElementById('ocrLang').value;
  _tesseractWorker = await Tesseract.createWorker(lang, 1, { logger: m => {} });
  return _tesseractWorker;
}

async function runFullOCR(onlyIdx = null){
  if(_busy) return alert('Process busy hai, thora intezar karein.');
  let indices = onlyIdx !== null ? [onlyIdx] : chapters.map((_, i) => i).filter(i => !chapters[i].ocrDone);
  
  if(!indices.length) return alert('Sab files ka OCR pehle hi ho chuka hai.');
  
  _busy = true;
  document.getElementById('ocrProgressContainer').classList.remove('hidden');
  updateProgress('ocr', 0);
  
  let totalPages = indices.reduce((s, i) => s + chapters[i].pages, 0);
  let donePages = 0;

  for(let idx of indices){
    let ch = chapters[idx];
    let buf = await ch.file.arrayBuffer();
    let pdf = await pdfjsLib.getDocument({data: buf}).promise;
    let pagesText = [];
    let scale = parseFloat(document.getElementById('ocrQuality').value);
    let worker = null;

    for(let p = 1; p <= pdf.numPages; p++){
      let page = await pdf.getPage(p);
      let pageTxt = '';
      
      try{
        let tc = await page.getTextContent();
        let t = tc.items.map(x => x.str).join(' ');
        if(t.trim().length > 50) pageTxt = stripInvisible(t);
      }catch(e){}

      if(!pageTxt){
        if(!worker) worker = await getTesseractWorker();
        let vp = page.getViewport({scale: scale});
        let c = document.createElement('canvas');
        c.width = vp.width; c.height = vp.height;
        let ctx = c.getContext('2d', {willReadFrequently: true});
        await page.render({canvasContext: ctx, viewport: vp}).promise;
        try{
          let ret = await worker.recognize(c);
          pageTxt = stripInvisible(ret.data.text || '');
        }catch(e){}
      }
      
      let cleaned = cleanOCRText(pageTxt);
      pagesText.push(cleaned);
      donePages++;
      updateProgress('ocr', (donePages / totalPages) * 100);
      document.getElementById('ocrStatus').textContent = `Extracting: ${ch.title} (Page ${p}/${pdf.numPages})`;
    }
    
    ch.pagesText = pagesText;
    ch.text = pagesText.join('\n\n--- Page Break ---\n\n');
    ch.ocrDone = true;
    renderChapters();
  }

  _busy = false;
  document.getElementById('ocrStatus').textContent = '✅ OCR Completed!';
  rebuildSyncedPages();
  setTimeout(()=>document.getElementById('ocrProgressContainer').classList.add('hidden'), 2000);
}

// ==========================================
// AI TRANSLATION (VIA CLOUDFLARE WORKER)
// ==========================================
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function geminiTranslateOne(text, target, retries = 3){
  let prompt = `You are a professional translator. Translate the following text STRICTLY and ONLY into "${target}". 
  RULES:
  1. IF TARGET IS ENGLISH: Write ONLY in English (Latin alphabet). NEVER output Urdu (Arabic script) or Hindi (Devanagari script) characters.
  2. IF TARGET IS URDU: Write ONLY in Urdu script (Arabic alphabet). NEVER output Roman Urdu or Hindi.
  3. If the text is complete gibberish (OCR error), just output " ". Do not try to translate gibberish.
  4. Do not add any explanations, just the translated text.
  
  Text to translate:
  ${text}`;

  let body = {
    contents: [{parts: [{text: prompt}]}],
    generationConfig: {temperature: 0.1, maxOutputTokens: 8000}
  };

  for(let i=0; i<retries; i++) {
    try {
      let r = await fetch(WORKER_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      
      let j = await r.json();
      
      if (!r.ok) {
        let msg = (j.error && j.error.message) || 'API Error';
        if (msg.includes('503') || msg.includes('high demand')) {
           document.getElementById('geminiStatus').textContent = `⚠️ Google busy. Retrying (${i+1}/${retries})...`;
           await sleep(4000);
           continue; 
        }
        if (msg.includes('429') || msg.toLowerCase().includes('quota')) throw new Error('Quota Exceeded');
        throw new Error(msg);
      }
      
      let out = j.candidates[0].content.parts.map(p => p.text || '').join('');
      
      // STRICT LANGUAGE CHECK (Agar AI ne galat language likhi to retry karo)
      try {
          return sanitizeOutput(out, target);
      } catch (sanitizeError) {
          document.getElementById('geminiStatus').textContent = `⚠️ ${sanitizeError.message}`;
          await sleep(2000);
          continue; // retry loop
      }
      
    } catch(e) {
      if(i === retries - 1) throw e;
      await sleep(3000);
    }
  }
}

async function translateWithGemini(){
  if(_busy) return alert('Process busy hai.');
  if(!chapters.length) return alert('Pehle PDF add karein.');
  if(!chapters.some(c => c.ocrDone)) return alert('Pehle OCR (text extract) karein.');
  
  let target = document.getElementById('targetLang').value;
  _busy = true;
  updateProgress('trans', 0);
  
  let totalPages = chapters.reduce((a, ch) => a + (ch.pagesText||[]).length, 0);
  let donePages = 0;

  try {
    for(let ch of chapters){
      if(!ch.pagesText) continue;
      let outPages = [];
      for(let pi = 0; pi < ch.pagesText.length; pi++){
        let rawText = ch.pagesText[pi];
        if(!rawText || !rawText.trim()) { 
            outPages.push('(OCR failed on this page)'); 
            donePages++; 
            continue; 
        }
        
        document.getElementById('geminiStatus').textContent = `🤖 Translating: ${ch.title} (Page ${pi+1}/${ch.pagesText.length})`;
        
        let translated = await geminiTranslateOne(rawText, target);
        outPages.push(translated);
        donePages++;
        updateProgress('trans', (donePages / totalPages) * 100);
        
        await sleep(2000);
      }
      ch.translatedPages = outPages;
    }
    document.getElementById('geminiStatus').textContent = '✅ Translation Complete!';
    rebuildSyncedPages();
  } catch(e) {
    document.getElementById('geminiStatus').textContent = '❌ Error: ' + e.message;
    alert('Translation Error: ' + e.message);
  }
  
  _busy = false;
}

function resetTranslationProgress(){
  if(!confirm('Translation reset karni hai?')) return;
  chapters.forEach(ch => ch.translatedPages = null);
  rebuildSyncedPages();
  updateProgress('trans', 0);
}

// ==========================================
// PREVIEW SYNC
// ==========================================
function rebuildSyncedPages(){
  _ocrPages = [];
  _transPagesSync = [];
  chapters.forEach((ch) => {
    let op = ch.pagesText || [], tp = ch.translatedPages || [];
    let n = Math.max(op.length, tp.length, 1);
    for(let pi = 0; pi < n; pi++){
      _ocrPages.push({text: op[pi] || ''});
      _transPagesSync.push({text: tp[pi] || ''});
    }
  });
  _syncedPageIdx = Math.min(_syncedPageIdx, Math.max(0, _ocrPages.length - 1));
  renderSyncedPage();
}
function renderSyncedPage(){
  let dv = document.getElementById('translatedBookView');
  let lb = document.getElementById('previewPageLabel');
  if(!_ocrPages.length){
    dv.textContent = 'Pehle OCR aur Translate karein.';
    lb.textContent = '0 / 0';
    return;
  }
  let cur = _transPagesSync[_syncedPageIdx] || {text: ''};
  dv.textContent = cur.text || '(Translation khali hai)';
  
  let tgt = document.getElementById('targetLang').value;
  let rtl = (tgt === 'ur' || tgt === 'ar');
  dv.dir = rtl ? 'rtl' : 'ltr';
  dv.className = 'flexBox w-full border p-3 rounded-lg bg-white text-[14px] leading-7 whitespace-pre-wrap ' + (rtl ? 'rtl-text' : 'ltr-text');
  
  lb.textContent = `${_syncedPageIdx+1} / ${_ocrPages.length}`;
}
function syncedPage(d){
  _syncedPageIdx = Math.max(0, Math.min(_ocrPages.length - 1, _syncedPageIdx + d));
  renderSyncedPage();
}

// ==========================================
// BOOK ASSEMBLER (UNIVERSAL LANGUAGE)
// ==========================================
async function ensureUrduFont(){
  try{
    await document.fonts.load('700 32px "Noto Nastaliq Urdu"');
    await document.fonts.load('400 32px "Noto Nastaliq Urdu"');
    await document.fonts.ready;
  }catch(e){}
}

async function renderPageAsImage(text, isUrdu){
  if(isUrdu) await ensureUrduFont();
  let W = 1240, H = 1754, margin = 90, maxW = W - margin*2;
  let c = document.createElement('canvas'); c.width = W; c.height = H;
  let ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#111111';
  
  if(isUrdu){
    ctx.direction = 'rtl'; ctx.textAlign = 'right';
    ctx.font = '400 34px "Noto Nastaliq Urdu", serif';
  } else {
    ctx.direction = 'ltr'; ctx.textAlign = 'left';
    ctx.font = '400 30px Georgia, serif';
  }

  let lineH = isUrdu ? 68 : 44, y = 110;
  let paras = String(text).split(/\n+/);
  for(let para of paras){
    if(!para.trim()){ y += lineH * 0.6; continue; }
    let words = para.replace(/\s+/g, ' ').trim().split(/\s+/);
    let cur = '';
    for(let w of words){
      let test = cur ? cur + ' ' + w : w;
      if(ctx.measureText(test).width <= maxW) cur = test;
      else {
        if(y > H - 80) break;
        ctx.fillText(cur, isUrdu ? W - margin : margin, y);
        y += lineH;
        cur = w;
      }
    }
    if(cur && y <= H - 80){
      ctx.fillText(cur, isUrdu ? W - margin : margin, y);
      y += lineH;
    }
    y += 14;
  }
  return new Promise(res => c.toBlob(b => {
    let r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(b);
  }, 'image/png'));
}

async function makeBook(){
  if(_busy) return alert('Process busy hai.');
  if(!chapters.length) return alert('Chapters add karein');
  if(!chapters.some(c => c.ocrDone)) return alert('Pehle OCR karein.');
  
  let target = document.getElementById('targetLang').value;
  let mode = document.getElementById('bookMode').value;
  let bookName = document.getElementById('bookName').value || 'Meri Book';
  
  _busy = true;
  updateProgress('book', 0);
  document.getElementById('status').textContent = 'Generating Book...';

  try {
    const merged = await PDFLib.PDFDocument.create();
    const font = await merged.embedFont(PDFLib.StandardFonts.Helvetica);

    // === COVER PAGE ===
    let cover = merged.addPage([595, 842]);
    let coverImgData = await renderPageAsImage(bookName, /[\u0600-\u06FF]/.test(bookName));
    let res = await fetch(coverImgData);
    let coverBuf = await res.arrayBuffer();
    let coverImg = await merged.embedPng(coverBuf);
    cover.drawImage(coverImg, {x: 0, y: 0, width: 595, height: 842});

    let totalChapters = chapters.length;
    for(let i = 0; i < chapters.length; i++){
      let ch = chapters[i];
      
      // === CHAPTER DIVIDER PAGE ===
      let div = merged.addPage([595, 842]);
      let divText = "CHAPTER " + (i+1) + "\n\n" + ch.title;
      let divImgData = await renderPageAsImage(divText, /[\u0600-\u06FF]/.test(divText));
      let divRes = await fetch(divImgData);
      let divBuf = await divRes.arrayBuffer();
      let divImg = await merged.embedPng(divBuf);
      div.drawImage(divImg, {x: 0, y: 0, width: 595, height: 842});

      // === TRANSLATED PAGES ===
      if(mode !== 'original'){
        let pagesToWrite = ch.translatedPages || [];
        for(let pi = 0; pi < pagesToWrite.length; pi++){
          let raw = stripInvisible(pagesToWrite[pi] || '');
          if(!raw.trim()) continue;

          let isUrdu = (target === 'ur' || target === 'ar');
          let dataUrl = await renderPageAsImage(raw, isUrdu);
          let res = await fetch(dataUrl);
          let buf = await res.arrayBuffer();
          let img = await merged.embedPng(buf);
          let pg = merged.addPage([595, 842]);
          pg.drawImage(img, {x: 0, y: 0, width: 595, height: 842});
          pg.drawText(String(pi+1), {x: 285, y: 20, size: 10, font});
        }
      }

      // === ORIGINAL PAGES ===
      if(mode !== 'translated'){
        let buf = await ch.file.arrayBuffer();
        let src = await PDFLib.PDFDocument.load(buf);
        let pages = await merged.copyPages(src, src.getPageIndices());
        pages.forEach(p => merged.addPage(p));
      }
      updateProgress('book', ((i+1)/totalChapters) * 100);
    }

    const bytes = await merged.save();
    let url = URL.createObjectURL(new Blob([bytes], {type: 'application/pdf'}));
    let safe = bookName.replace(/[^\w\- ]/g, '') || 'Meri Book';
    
    document.getElementById('downloadArea').innerHTML = 
      '<a href="' + url + '" download="' + safe + '.pdf" class="block text-center bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-bold mt-3 shadow-md transition">⬇ Download ' + safe + '.pdf</a>';
    
    document.getElementById('status').textContent = '✅ Book Ready!';
  } catch(e) {
    document.getElementById('status').textContent = '❌ Error: ' + e.message;
    console.error(e);
  }
  _busy = false;
}
</script>
